# TamashaRoom — Sail local HTTPS (mkcert)
# Production stays cPanel/Apache; this is local-only via Sail's nginx sidecar.
# Certs: ./docker/ssl/tamasharoom.test.pem + -key.pem (mkcert, .gitignored)

# HTTP → HTTPS redirect (VPN-safe: loopback only, no external adapter binding)
server {
    listen 80;
    server_name tamasharoom.test localhost;
    return 301 https://tamasharoom.test$request_uri;
}

# HTTPS — terminates SSL and proxies to artisan serve (laravel.test:80)
server {
    listen 443 ssl;
    http2 on;
    server_name tamasharoom.test;

    ssl_certificate /etc/nginx/ssl/tamasharoom.test.pem;
    ssl_certificate_key /etc/nginx/ssl/tamasharoom.test-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 512M;

    # Trust Sail's proxy headers so Laravel sees https
    location / {
        proxy_pass http://laravel.test:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket upgrade for Vite HMR if proxied via nginx (also keep direct 5173)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: proxy Vite HMR through nginx as well (keeps single origin)
    # Browser can also hit https://tamasharoom.test:5173 directly when Vite runs with https.
    location ~* ^/@vite|^/src/|^/resources/ {
        proxy_pass http://laravel.test:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
