name: CI

on:
  push:
    branches: [main, master, frontend_rebuild, codex/security-reliability-phase3]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans the pushed commit range; the default shallow
          # checkout (depth 1) omits the base commit and breaks the scan.
          fetch-depth: 0

      - name: Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: pcov
          extensions: mbstring, pdo, pdo_mysql, sqlite, gd, zip, intl
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Audit Composer dependencies (locked, including development)
        run: composer audit --locked

      - name: Audit NPM runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # Legacy Vite 5 needs a separate major-version migration.
      # Keep their advisories visible without hiding runtime/test failures.
      - name: Report NPM development advisories (migration debt)
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: warn

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --env=testing --force

      - name: Build frontend assets
        run: npm run build

      - name: Validate release package boundaries
        shell: pwsh
        run: ./scripts/test-deploy-package.ps1

      - name: Set up database for server
        run: php artisan migrate --force

      - name: Create storage symlink
        run: php artisan storage:link

      - name: Start Laravel Server
        run: php artisan serve --port=8000 &
        env:
          SESSION_SECURE_COOKIE: false
          # Mirrors the a11y/E2E Playwright webServer env. Playwright reuses this
          # already-running server (reuseExistingServer: true), so the Playwright
          # config's own env override never applies in CI. Without array mailer,
          # registration (auth-a11y "Verify email") hits real Resend and 500s on
          # the @example.com test address -- the server must carry the override.
          MAIL_MAILER: array
          PHP_CLI_SERVER_WORKERS: "4"

      - name: Wait for Server to be Ready
        run: sleep 3

      # The measured baseline is 86.6%; enforce an 80% minimum.
      - name: Run PHP tests with coverage
        run: php artisan test --coverage --min=80 --coverage-clover=storage/app/coverage/phpunit/clover.xml --coverage-html=storage/app/coverage/phpunit/html
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Generate Vitest Coverage
        run: npm run test -- --coverage

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: storage/app/coverage/
          if-no-files-found: warn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Visual Regression Tests
        id: visual
        run: npx playwright test visual-regression --config=tests/e2e/playwright.config.ts --project=chromium

      - name: Upload visual test results
        if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Run Pint style check
        run: ./vendor/bin/pint --test

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run docs & skills drift check
        run: npm run check:docs

      - name: Run Playwright a11y tests
        id: a11y
        run: npm run test:a11y
        env:
          APP_ENV: local

      - name: Upload a11y test results
        if: failure() && steps.a11y.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Run Playwright E2E tests
        id: e2e
        run: npm run test:e2e -- --project=chromium
        env:
          APP_ENV: local

      - name: Upload E2E failure evidence
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: warn


