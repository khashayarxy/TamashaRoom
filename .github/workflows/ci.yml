name: CI

on:
  push:
    branches: [main, master, frontend_rebuild]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans the pushed commit range; the default shallow
          # checkout (depth 1) omits the base commit and breaks the scan.
          fetch-depth: 0

      - name: Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo, pdo_mysql, sqlite, gd, zip, intl
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Create environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --env=testing --force

      - name: Build frontend assets
        run: npm run build

      - name: Set up database for server
        run: php artisan migrate --force

      - name: Create storage symlink
        run: php artisan storage:link

      - name: Start Laravel Server
        run: php artisan serve --port=8000 &
        env:
          SESSION_SECURE_COOKIE: false

      - name: Wait for Server to be Ready
        run: sleep 3

      - name: Run PHP tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run Pint style check
        run: ./vendor/bin/pint --test

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run docs & skills drift check
        run: npm run check:docs

      - name: Run Vitest frontend tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright a11y tests
        run: npm run test:a11y
        env:
          APP_ENV: local

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          APP_ENV: local


